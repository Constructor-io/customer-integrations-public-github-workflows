name: Dependabot Reviewer Rotation

on:
  workflow_call:
    inputs:
      team:
        description: 'GitHub team slug (e.g., "prospect-data-solutions")'
        required: true
        type: string
      debug:
        description: 'Enable debug logging'
        required: false
        type: boolean
        default: false
    secrets:
      github-app-id:
        description: 'GitHub App ID with read:org permissions'
        required: true
      github-app-private-key:
        description: 'GitHub App private key'
        required: true

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.github-app-id }}
          private-key: ${{ secrets.github-app-private-key }}
          owner: Constructor-io

      - name: Checkout shared workflows repo
        uses: actions/checkout@v4
        with:
          repository: Constructor-io/customer-integrations-public-github-workflows

      - name: Assign reviewer based on rotation
        uses: actions/github-script@v7
        env:
          TEAM_SLUG: ${{ inputs.team }}
          DEBUG: ${{ inputs.debug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dependabot-reviewer-rotation.js`);
            await script({ github, context });
