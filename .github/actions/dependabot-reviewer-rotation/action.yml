name: 'Dependabot Reviewer Rotation'
description: 'Assign a rotating reviewer to Dependabot PRs based on team membership'

inputs:
  team:
    description: 'GitHub team slug (e.g., "prospect-data-solutions")'
    required: true
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'
  github-app-id:
    description: 'GitHub App ID with read:org permissions'
    required: true
  github-app-private-key:
    description: 'GitHub App private key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: Constructor-io

    - name: Assign reviewer based on rotation
      uses: actions/github-script@v7
      env:
        TEAM_SLUG: ${{ inputs.team }}
        DEBUG: ${{ inputs.debug }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const { default: script } = await import(`${{ github.action_path }}/dependabot-reviewer-rotation.js`);
          await script({ github, context });
